<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Urban Canopy Project - Tree Library</title>
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f7f0;
            color: #1e3a2e;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ----- Navigation ----- */
        nav {
            background: #1e3a2e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        nav .logo {
            color: #b8d9b0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        nav .logo span {
            color: #7cb86c;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }
        nav ul li a {
            color: #e8f5e0;
            font-weight: 500;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            transition: background 0.25s, color 0.25s;
        }
        nav ul li a:hover,
        nav ul li a.active {
            background: #3a6b4f;
            color: #fff;
        }

        /* ----- Main Content ----- */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
            color: #1e3a2e;
        }
        .subhead {
            color: #3a6b4f;
            margin-bottom: 1.8rem;
            font-size: 1.1rem;
        }

        /* ----- Filter Bar ----- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .filter-bar button {
            background: white;
            border: 2px solid #3a6b4f;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            color: #1e3a2e;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-bar button:hover,
        .filter-bar button.active-filter {
            background: #3a6b4f;
            color: white;
        }

        /* ----- Tree Grid ----- */
        .tree-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }
        .tree-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            padding-bottom: 1rem;
        }
        .tree-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.10);
        }
        .tree-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .tree-card .info {
            padding: 0.8rem 1.2rem 1rem;
        }
        .tree-card .info h3 {
            margin-bottom: 0.3rem;
            font-size: 1.25rem;
        }
        .tree-card .info .benefit {
            font-size: 0.9rem;
            color: #2d5a3b;
            background: #e6f3e6;
            padding: 0.25rem 0.8rem;
            border-radius: 40px;
            display: inline-block;
            margin: 0.4rem 0 0.6rem;
        }
        .tree-card .info .co2 {
            font-weight: 600;
            color: #1a4a2a;
        }
        .tree-card .info button {
            background: #1e3a2e;
            color: white;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            margin-top: 0.4rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .tree-card .info button:hover {
            background: #3a6b4f;
        }

        /* ----- Calculator ----- */
        .calc-section {
            margin-top: 3rem;
            background: #e2efe2;
            border-radius: 24px;
            padding: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
            justify-content: center;
        }
        .calc-section select,
        .calc-section input {
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #3a6b4f;
            font-size: 1rem;
            min-width: 180px;
        }
        .calc-section button {
            background: #1e3a2e;
            color: white;
            border: none;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .calc-section button:hover {
            background: #3a6b4f;
        }
        .calc-result {
            font-size: 1.2rem;
            font-weight: 600;
            background: white;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            min-width: 200px;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #3a5a3a;
            border-top: 1px solid #c6dcc6;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e3a2e;
            color: #e8f5e0;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 0.6rem;
                padding: 0.8rem;
            }
            nav ul {
                gap: 0.8rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">🌳 Urban <span>Canopy</span></div>
        <ul>
            <li><a href="index.html">Canopy Mapper</a></li>
            <li><a href="library.html" class="active">Tree Library</a></li>
            <li><a href="community.html">Green Team</a></li>
        </ul>
    </nav>

    <!-- ========== PAGE 2: TREE LIBRARY ========== -->
    <div class="container">
        <h1>📚 The Tree Library</h1>
        <p class="subhead">Discover native and common urban trees. Filter by type or calculate their impact.</p>

        <div class="filter-bar" id="filterBar">
            <button class="active-filter" data-filter="all">All</button>
            <button data-filter="native">Native</button>
            <button data-filter="ornamental">Ornamental</button>
            <button data-filter="shade">Shade</button>
        </div>

        <div class="tree-grid" id="treeGrid"></div>

        <!-- Calculator -->
        <div class="calc-section">
            <label for="treeSelect">Choose a tree:</label>
            <select id="treeSelect"></select>
            <label for="treeCount">How many?</label>
            <input type="number" id="treeCount" value="1" min="1" max="100" />
            <button id="calcBtn">🌱 Calculate Benefit</button>
            <div class="calc-result" id="calcResult">CO₂ offset: 0 lbs/yr</div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Footer -->
    <footer>
        🌳 The Urban Canopy Project — built with ❤️ for greener cities.
    </footer>

    <script>
        // ---------- TOAST ----------
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3200);
        }

        // ---------- TREE DATA (JSON) ----------
        const treeData = [{
            id: 1,
            name: 'Red Maple',
            type: 'native',
            image: 'https://images.unsplash.com/photo-1589571894960-20bbe2828f6d?w=400&h=300&fit=crop',
            benefit: 'Provides excellent shade, supports wildlife.',
            co2: 48
        }, {
            id: 2,
            name: 'Dogwood',
            type: 'ornamental',
            image: 'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=400&h=300&fit=crop',
            benefit: 'Beautiful spring blossoms, attracts pollinators.',
            co2: 22
        }, {
            id: 3,
            name: 'Oak',
            type: 'native',
            image: 'https://images.unsplash.com/photo-1598532163256-5e1137cf24e7?w=400&h=300&fit=crop',
            benefit: 'Massive canopy, absorbs 48 lbs CO₂ per year.',
            co2: 48
        }, {
            id: 4,
            name: 'Japanese Maple',
            type: 'ornamental',
            image: 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=400&h=300&fit=crop',
            benefit: 'Stunning foliage, perfect for small yards.',
            co2: 18
        }, {
            id: 5,
            name: 'American Elm',
            type: 'shade',
            image: 'https://images.unsplash.com/photo-1598532163256-5e1137cf24e7?w=400&h=300&fit=crop',
            benefit: 'Classic shade tree, disease-resistant varieties.',
            co2: 40
        }, {
            id: 6,
            name: 'Silver Linden',
            type: 'shade',
            image: 'https://images.unsplash.com/photo-1589571894960-20bbe2828f6d?w=400&h=300&fit=crop',
            benefit: 'Fragrant flowers, excellent for urban heat reduction.',
            co2: 35
        }];

        let currentFilter = 'all';

        function renderTrees(filter = 'all') {
            const grid = document.getElementById('treeGrid');
            const filtered = filter === 'all' ? treeData : treeData.filter(t => t.type === filter);
            grid.innerHTML = '';
            filtered.forEach(tree => {
                const card = document.createElement('div');
                card.className = 'tree-card';
                card.innerHTML = `
                    <img src="${tree.image}" alt="${tree.name}" loading="lazy" />
                    <div class="info">
                        <h3>${tree.name}</h3>
                        <span class="benefit">${tree.type}</span>
                        <p>${tree.benefit}</p>
                        <p class="co2">🌍 ${tree.co2} lbs CO₂/year</p>
                        <button data-id="${tree.id}">📖 Learn More (API)</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            grid.querySelectorAll('button[data-id]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    const tree = treeData.find(t => t.id === id);
                    if (tree) {
                        const query = encodeURIComponent(tree.name + ' tree');
                        const url = `https://en.wikipedia.org/wiki/${query}`;
                        window.open(url, '_blank');
                        showToast(`🔍 Opening info for ${tree.name}...`);
                    }
                });
            });

            populateSelect(filtered);
        }

        function populateSelect(trees) {
            const sel = document.getElementById('treeSelect');
            sel.innerHTML = '';
            trees.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name;
                sel.appendChild(opt);
            });
        }

        // Filter buttons
        document.querySelectorAll('#filterBar button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('active-filter'));
                btn.classList.add('active-filter');
                currentFilter = btn.dataset.filter;
                renderTrees(currentFilter);
            });
        });

        // Calculator
        document.getElementById('calcBtn').addEventListener('click', () => {
            const sel = document.getElementById('treeSelect');
            const count = parseInt(document.getElementById('treeCount').value) || 1;
            const treeId = parseInt(sel.value);
            const tree = treeData.find(t => t.id === treeId);
            if (tree) {
                const total = tree.co2 * count;
                document.getElementById('calcResult').textContent = `🌿 CO₂ offset: ${total} lbs/yr`;
                showToast(`🌱 ${tree.name} × ${count} = ${total} lbs CO₂/year!`);
            } else {
                showToast('Please select a valid tree.');
            }
        });

        renderTrees('all');
        console.log('🌳 Tree Library loaded successfully!');
    </script>

</body>
</html>
