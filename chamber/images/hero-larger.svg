<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Skyline illustration linking Accra, Ghana and Vietnam's trade cities</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B3B2A"/>
      <stop offset="48%" stop-color="#0F5C3C"/>
      <stop offset="52%" stop-color="#7A1620"/>
      <stop offset="100%" stop-color="#4A0E13"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="100%" stop-color="#FCD116"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="480" fill="url(#sky)"/>
  <circle cx="700" cy="150" r="90" fill="url(#sun)" opacity="0.9"/>

  <!-- ocean band -->
  <rect x="0" y="400" width="1400" height="80" fill="#08281E" opacity="0.55"/>

  <!-- GHANA SIDE (left): Black Star Gate arch + skyline -->
  <g opacity="0.92">
    <rect x="40" y="300" width="26" height="120" fill="#062E20"/>
    <rect x="150" y="260" width="34" height="160" fill="#062E20"/>
    <rect x="260" y="330" width="24" height="90" fill="#062E20"/>
    <!-- arch -->
    <path d="M330 420 L330 300 Q330 250 380 250 Q430 250 430 300 L430 420" fill="none" stroke="#062E20" stroke-width="18"/>
    <path d="M362 420 V310" stroke="#062E20" stroke-width="10"/>
    <path d="M398 420 V310" stroke="#062E20" stroke-width="10"/>
    <!-- black star on arch -->
    <path d="M380 220 l6.5 20h21l-17 12.3 6.5 20-17-12.3-17 12.3 6.5-20-17-12.3h21z" fill="#1B1B1B"/>
    <!-- palm trees -->
    <g fill="#062E20">
      <rect x="500" y="330" width="8" height="90"/>
      <path d="M504 335 q-30 -10 -46 6 q26 4 46 -6z"/>
      <path d="M504 335 q30 -10 46 6 q-26 4 -46 -6z"/>
      <path d="M504 335 q-8 -28 8 -44 q8 24 -8 44z"/>
    </g>
  </g>

  <!-- VIETNAM SIDE (right): pagoda-top towers + junk boat sail -->
  <g opacity="0.92">
    <rect x="1330" y="290" width="30" height="130" fill="#3A0A0C"/>
    <rect x="1230" y="250" width="36" height="170" fill="#3A0A0C"/>
    <g fill="#3A0A0C">
      <rect x="960" y="230" width="40" height="190"/>
      <polygon points="948,230 1012,230 980,195"/>
      <rect x="1050" y="270" width="30" height="150"/>
      <polygon points="1042,270 1088,270 1065,242"/>
    </g>
  </g>

  <!-- Center: cargo ship linking both shores -->
  <g transform="translate(650,360)">
    <path d="M0 40 L20 40 L30 60 L-30 60 L-20 40 Z" fill="#F4F0E4"/>
    <rect x="-14" y="12" width="10" height="28" fill="#F4F0E4"/>
    <rect x="4" y="4" width="10" height="36" fill="#F4F0E4"/>
    <rect x="-46" y="60" width="112" height="14" fill="#062E20"/>
    <rect x="-40" y="52" width="20" height="10" fill="#CE1126"/>
    <rect x="-14" y="52" width="20" height="10" fill="#FCD116"/>
    <rect x="12" y="52" width="20" height="10" fill="#DA251D"/>
  </g>

  <!-- flight path dashes -->
  <path d="M300 120 Q700 40 1100 130" fill="none" stroke="#FCD116" stroke-width="2" stroke-dasharray="6 10" opacity="0.6"/>
  <polygon points="1095,122 1118,130 1098,140" fill="#FCD116" opacity="0.8"/>
</svg>
