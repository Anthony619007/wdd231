<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Ghana Vietnam Chamber of Commerce emblem</title>
  <defs>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="86"/>
    </clipPath>
  </defs>

  <!-- outer gold ring -->
  <circle cx="100" cy="100" r="96" fill="#FCD116"/>
  <circle cx="100" cy="100" r="90" fill="#FFFFFF"/>

  <g clip-path="url(#circleClip)">
    <!-- Ghana half (left) -->
    <g>
      <rect x="14" y="14" width="86" height="28.7" fill="#CE1126"/>
      <rect x="14" y="42.7" width="86" height="28.6" fill="#FCD116"/>
      <rect x="14" y="71.3" width="86" height="28.7" fill="#046A38"/>
      <rect x="14" y="100" width="86" height="86" fill="#046A38"/>
      <path d="M57 78 l4.6 14.2h14.9l-12.1 8.8 4.6 14.2-12-8.8-12 8.8 4.6-14.2-12.1-8.8h14.9z" fill="#1B1B1B"/>
    </g>
    <!-- Vietnam half (right) -->
    <g>
      <rect x="100" y="14" width="86" height="172" fill="#DA251D"/>
      <path d="M143 60 l7.4 22.8h24l-19.4 14.1 7.4 22.8-19.4-14.1-19.4 14.1 7.4-22.8-19.4-14.1h24z" fill="#FFCD00"/>
    </g>
  </g>

  <!-- center divider + ring detail -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#1B1B1B" stroke-width="1.5" opacity="0.15"/>
  <line x1="100" y1="14" x2="100" y2="186" stroke="#FFFFFF" stroke-width="3"/>

  <!-- monogram banner -->
  <g>
    <rect x="46" y="92" width="108" height="20" rx="10" fill="#1B1B1B" opacity="0.88"/>
    <text x="100" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" fill="#FCD116" letter-spacing="1.5">GVCC</text>
  </g>
</svg>
