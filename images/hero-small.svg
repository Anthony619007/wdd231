<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="heroSmallTitle">
  <title id="heroSmallTitle">Skyline illustration linking Accra, Ghana and Vietnam's trade cities</title>
  <defs>
    <linearGradient id="skyS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B3B2A"/>
      <stop offset="48%" stop-color="#0F5C3C"/>
      <stop offset="52%" stop-color="#7A1620"/>
      <stop offset="100%" stop-color="#4A0E13"/>
    </linearGradient>
    <radialGradient id="sunS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="100%" stop-color="#FCD116"/>
    </radialGradient>
  </defs>

  <rect width="800" height="420" fill="url(#skyS)"/>
  <circle cx="400" cy="130" r="70" fill="url(#sunS)" opacity="0.9"/>
  <rect x="0" y="350" width="800" height="70" fill="#08281E" opacity="0.55"/>

  <!-- Ghana arch left -->
  <g opacity="0.92">
    <rect x="40" y="270" width="22" height="90" fill="#062E20"/>
    <path d="M100 360 L100 260 Q100 220 140 220 Q180 220 180 260 L180 360" fill="none" stroke="#062E20" stroke-width="14"/>
    <path d="M125 360 V268" stroke="#062E20" stroke-width="8"/>
    <path d="M155 360 V268" stroke="#062E20" stroke-width="8"/>
    <path d="M140 190 l5.5 17h18l-14.5 10.5 5.5 17-14.5-10.5-14.5 10.5 5.5-17-14.5-10.5h18z" fill="#1B1B1B"/>
  </g>

  <!-- Vietnam pagoda right -->
  <g opacity="0.92">
    <rect x="600" y="220" width="36" height="140" fill="#3A0A0C"/>
    <polygon points="590,220 646,220 618,190" fill="#3A0A0C"/>
    <rect x="680" y="255" width="26" height="105" fill="#3A0A0C"/>
    <polygon points="672,255 714,255 693,232" fill="#3A0A0C"/>
  </g>

  <!-- center cargo ship -->
  <g transform="translate(390,300)">
    <path d="M0 34 L17 34 L25 50 L-25 50 L-17 34 Z" fill="#F4F0E4"/>
    <rect x="-12" y="10" width="8" height="24" fill="#F4F0E4"/>
    <rect x="3" y="3" width="8" height="31" fill="#F4F0E4"/>
    <rect x="-38" y="50" width="92" height="12" fill="#062E20"/>
    <rect x="-32" y="43" width="16" height="8" fill="#CE1126"/>
    <rect x="-10" y="43" width="16" height="8" fill="#FCD116"/>
    <rect x="12" y="43" width="16" height="8" fill="#DA251D"/>
  </g>

  <path d="M180 95 Q400 30 630 100" fill="none" stroke="#FCD116" stroke-width="2" stroke-dasharray="5 8" opacity="0.6"/>
  <polygon points="626,93 645,100 628,109" fill="#FCD116" opacity="0.8"/>
</svg>
